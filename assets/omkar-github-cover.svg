<svg width="1600" height="560" viewBox="0 0 1600 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Omkar Mahabdi — AI/ML Engineer and Python Developer</title>
  <desc id="desc">Recruiter-focused profile banner highlighting RAG, LLM evaluation, safe text-to-SQL and measurable engineering outcomes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050914"/>
      <stop offset="0.54" stop-color="#0B1225"/>
      <stop offset="1" stop-color="#071A1B"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="100" x2="810" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#68A7FF"/>
      <stop offset="0.48" stop-color="#8668FF"/>
      <stop offset="1" stop-color="#46E0B5"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6D5DFC" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#45D6AE" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1320 80) rotate(135) scale(620 420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20C997" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#20C997" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000814" flood-opacity="0.5"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#A9B7D0" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1600" height="560" rx="34" fill="url(#bg)"/>
