  <rect width="1600" height="560" rx="34" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="1597" height="557" rx="32.5" stroke="#7686A5" stroke-opacity="0.35" stroke-width="3"/>

  <circle cx="92" cy="84" r="32" fill="#6D5DFC"/>
