    <text x="22" y="42" fill="#F6F8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="31" font-weight="780">92%+</text>
    <text x="22" y="72" fill="#91A1B9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">retrieval accuracy</text>
  </g>
  <g transform="translate(552 348)">
    <rect width="244" height="102" rx="18" fill="#111B31" stroke="#364668"/>
    <text x="22" y="42" fill="#F6F8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="31" font-weight="780">500+</text>
